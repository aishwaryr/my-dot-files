
set -g prefix C-s

# Mouse + clipboard
set -g mouse on
set -g set-clipboard on

# Status bar
set -g status-style bg=#0f0f1a,fg=#ff2e88
set -g message-style bg=#ff2e88,fg=#0f0f1a
set -g status-interval 10

# Real tmux window list on left
set -g status-left ""
set -g status-justify left

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#ff2e88,fg=#0f0f1a,bold] #I:#W #[default]"
set -g window-status-separator ""

# Date/time on right
set -g status-right-length 200
set -g status-right "%a %d %b %H:%M"

set -g focus-events on

# Start windows/panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
